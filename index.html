<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>园区后台管理系统-首页</title>
    <link rel="stylesheet" href="./Index.css">
</head>
<script src="test.js"></script>
<body>
    <!-- 顶部导航栏 -->
    <header class="header">
        <button class="toggle-btn" id="toggleBtn">☰</button>
        <span class="title">园区后台管理系统</span>
        <span class="admin">👤 管理员：彭于晏</span>
    </header>

    <div class="wrapper">
        <!-- 左侧侧边导航栏 -->
        <aside class="sidebar">
            <ul>
                <li class="active" data-page="Index.html"><span>📊</span><span class="menu-text">仪表盘</span></li>
                <li data-page="monthCard.html"><span>📇</span><span class="menu-text">月卡管理</span></li>
            </ul>
        </aside>

        <!-- 右侧主内容区 -->
        <main class="main-content">
            <h2>仪表盘<span id="size"> --园区运营数据总览</span></h2>
            <hr>

            <!-- 4 个统计卡片 -->
            <div class="stat-row">
                <div class="stat-card">
                    <span class="icon">💰</span>
                    <div>
                        <div class="num" id="statMoney">￥0</div>
                        <div class="label">年度累计收费(元)</div>
                    </div>
                </div>
                <div class="stat-card">
                    <span class="icon">🏢</span>
                    <div>
                        <div class="num" id="statCompany">0</div>
                        <div class="label">入驻企业总数(家)</div>
                    </div>
                </div>
                <div class="stat-card">
                    <span class="icon">🅿️</span>
                    <div>
                        <div class="num" id="statPole">0</div>
                        <div class="label">一体杆总数(台)</div>
                    </div>
                </div>
                <div class="stat-card">
                    <img src="./image.png" alt="月卡图标">
                    <div>
                        <div class="num" id="statCard">0</div>
                        <div class="label">月卡车辆总数(张)</div>
                    </div>
                </div>
            </div>

            <!-- 快捷入口模块 -->
            <h2>快捷入口</h2>
            <hr>
            <div class="quick-row">
                <a class="quick-card" href="monthCard.html">
                    <span class="qicon">📇</span>月卡管理
                </a>
                <a class="quick-card" href="AddmonthCard.html">
                    <span class="qicon">➕</span>新增月卡
                </a>
                <a class="quick-card" href="javascript:location.reload()">
                    <span class="qicon">🔄</span>刷新统计
                </a>
            </div>

            <!-- 预留扩展占位容器
            <h2>扩展功能</h2>
            <hr>
            <div class="placeholder">
                扩展功能区域（预留位置，后续开发）
            </div>
        </main>
    </div> -->

    <script>
        /* ========== 首页统计渲染函数（数据驱动视图） ========== */
        function renderHomeStat() {
            // 读取 localStorage 月卡数据（没有则初始化默认模拟数据）
            var cardList = getMonthCards();

            // 年度累计收费、入驻企业总数、一体杆总数：模拟固定值
            document.getElementById('statMoney').innerText = '￥' + formatMoney(286450);
            document.getElementById('statCompany').innerText = 36;
            document.getElementById('statPole').innerText = 128;

            // 月卡车辆总数：从月卡数组长度动态计算
            document.getElementById('statCard').innerText = cardList.length;
        }

        /* 页面加载完成：初始化菜单交互 + 渲染统计数据 */
        window.onload = function () {
            initLayout();
            renderHomeStat();
        };
    </script>
</body>
</html>
