<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>园区后台管理系统-月卡管理</title>
    <link rel="stylesheet" href="./Index.css">
</head>
<script src="test.js"></script>
<body>
    <!-- 顶部导航栏 -->
    <header class="header">
        <button class="toggle-btn" id="toggleBtn">☰</button>
        <span class="title">园区后台管理系统</span>
        <span class="admin">👤 管理员：彭于晏</span>
    </header>

    <div class="wrapper">
        <!-- 左侧侧边导航栏 -->
        <aside class="sidebar">
            <ul>
                <li data-page="Index.html"><span>📊</span><span class="menu-text">仪表盘</span></li>
                <li class="active" data-page="monthCard.html"><span>📇</span><span class="menu-text">月卡管理</span></li>
            </ul>
        </aside>

        <!-- 右侧主内容区 -->
        <main class="main-content">
            <h2>月卡管理<span id="size"> --园区车辆月卡信息维护</span></h2>
            <hr>

            <!-- 查询筛选区域 -->
            <div class="card-box search-card">
                <label>车主姓名/手机号：</label>
                <input type="text" id="searchKeyword" placeholder="请输入姓名或手机号">
                <label>车牌号：</label>
                <input type="text" id="searchPlate" placeholder="请输入车牌号">
                <label>状态：</label>
                <select id="searchStatus">
                    <option value="">全部</option>
                    <option value="0">可用</option>
                    <option value="1">已过期</option>
                </select>
                <button class="button" onclick="doSearch()">🔍 查询</button>
                <button class="button btn-gray" onclick="doReset()">↻ 重置</button>
                <button class="button" onclick="addCard()">➕ 添加月卡</button>
                <button class="button btn-red" onclick="batchDelete()">🗑 批量删除</button>
            </div>

            <!-- 月卡数据表格 -->
            <div class="card-box">
                <table class="data-table">
                    <thead>
                        <tr>
                            <th><input type="checkbox" id="checkAll" onclick="toggleAll(this)"></th>
                            <th>序号</th>
                            <th>车主姓名</th>
                            <th>手机号</th>
                            <th>车牌号</th>
                            <th>月卡类型</th>
                            <th>开始日期</th>
                            <th>结束日期</th>
                            <th>缴费金额(元)</th>
                            <th>剩余天数</th>
                            <th>状态</th>
                            <th>操作</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody">
                        <!-- 表格内容由 renderTable() 动态生成 -->
                    </tbody>
                </table>

                <!-- 分页栏 -->
                <div class="pager">
                    <span id="totalText">共 0 条</span>
                    <label>每页</label>
                    <select id="pageSize" onchange="changePageSize()">
                        <option value="5">5</option>
                        <option value="10">10</option>
                        <option value="20">20</option>
                    </select>
                    <label>条</label>
                    <button class="button btn-sm btn-gray" id="prevBtn" onclick="prevPage()">上一页</button>
                    <span id="pageText">第 1 / 1 页</span>
                    <button class="button btn-sm btn-gray" id="nextBtn" onclick="nextPage()">下一页</button>
                </div>
            </div>
        </main>
    </div>

    <!-- ========== 查看 / 编辑 共用弹窗 ========== -->
    <div class="modal-mask" id="modalMask">
        <div class="modal-dialog">
            <div class="modal-title" id="modalTitle">月卡信息</div>
            <div class="form-grid">
                <div class="form-item">
                    <label>车主姓名 *</label>
                    <input type="text" id="m_ownerName">
                </div>
                <div class="form-item">
                    <label>手机号 *</label>
                    <input type="text" id="m_phone">
                </div>
                <div class="form-item">
                    <label>车牌号 *</label>
                    <input type="text" id="m_plateNo">
                </div>
                <div class="form-item">
                    <label>月卡类型 *</label>
                    <select id="m_cardType">
                        <option value="月卡">月卡</option>
                        <option value="季卡">季卡</option>
                        <option value="年卡">年卡</option>
                    </select>
                </div>
                <div class="form-item">
                    <label>开始日期 *</label>
                    <input type="date" id="m_startDate">
                </div>
                <div class="form-item">
                    <label>结束日期 *</label>
                    <input type="date" id="m_endDate" onchange="calcModalDay()">
                </div>
                <div class="form-item">
                    <label>缴费金额(元) *</label>
                    <input type="number" id="m_payAmount">
                </div>
                <div class="form-item">
                    <label>支付方式 *</label>
                    <select id="m_payType">
                        <option value="微信支付">微信支付</option>
                        <option value="支付宝">支付宝</option>
                        <option value="现金">现金</option>
                    </select>
                </div>
                <div class="form-item">
                    <label>剩余有效天数（自动计算）</label>
                    <input type="text" id="m_remainDay" disabled>
                </div>
                <div class="form-item">
                    <label>月卡状态（自动判断）</label>
                    <input type="text" id="m_status" disabled>
                </div>
            </div>
            <div class="err-msg" id="m_errMsg"></div>
            <div class="modal-footer">
                <button class="button" id="modalSaveBtn" onclick="saveModal()">保存</button>
                <button class="button btn-gray" onclick="closeModal()">关闭</button>
            </div>
        </div>
    </div>

    <script>
        /* ========== 数据源（从 localStorage 读取） ========== */
        var allData = getMonthCards();     // 全部月卡数据
        var viewData = allData.slice();    // 当前筛选后展示的数据
        var currentPage = 1;               // 当前页码
        var pageSize = 5;                  // 每页条数

        var editingId = null;              // 当前弹窗操作的月卡 id

        /* ========== 表格渲染函数（数据驱动视图） ========== */
        function renderTable() {
            var tbody = document.getElementById('tableBody');
            var total = viewData.length;
            var totalPages = Math.ceil(total / pageSize) || 1;  // 没数据时至少 1 页
            if (currentPage > totalPages) currentPage = totalPages;

            // slice 分页截取当前页数据
            var start = (currentPage - 1) * pageSize;
            var pageData = viewData.slice(start, start + pageSize);

            var html = '';
            if (pageData.length === 0) {
                html = '<tr><td colspan="12" style="padding:30px;color:gray;">暂无月卡数据</td></tr>';
            }
            for (var i = 0; i < pageData.length; i++) {
                var c = pageData[i];
                // 状态格式化：0 可用，1 已过期
                var statusTag = c.status === 0
                    ? '<span class="tag-ok">可用</span>'
                    : '<span class="tag-exp">已过期</span>';
                // 剩余天数显示
                var dayText = c.remainDay >= 0 ? c.remainDay + ' 天' : '—';
                html += '<tr>'
                    + '<td><input type="checkbox" class="rowCheck" value="' + c.id + '"></td>'
                    + '<td>' + (start + i + 1) + '</td>'
                    + '<td>' + c.ownerName + '</td>'
                    + '<td>' + c.phone + '</td>'
                    + '<td>' + c.plateNo + '</td>'
                    + '<td>' + c.cardType + '</td>'
                    + '<td>' + c.startDate + '</td>'
                    + '<td>' + c.endDate + '</td>'
                    + '<td>' + formatMoney(c.payAmount) + '</td>'
                    + '<td>' + dayText + '</td>'
                    + '<td>' + statusTag + '</td>'
                    + '<td>'
                    + '<button class="button btn-sm btn-blue" onclick="viewCard(' + c.id + ')">查看</button>'
                    + '<button class="button btn-sm" onclick="editCard(' + c.id + ')">编辑</button>'
                    + '<button class="button btn-sm btn-red" onclick="deleteCard(' + c.id + ')">删除</button>'
                    + '</td>'
                    + '</tr>';
            }
            tbody.innerHTML = html;

            // 更新分页栏信息
            document.getElementById('totalText').innerText = '共 ' + total + ' 条';
            document.getElementById('pageText').innerText = '第 ' + currentPage + ' / ' + totalPages + ' 页';
            document.getElementById('prevBtn').disabled = currentPage <= 1;
            document.getElementById('nextBtn').disabled = currentPage >= totalPages;
            document.getElementById('checkAll').checked = false;
        }

        /* ========== 条件筛选（filter 过滤） ========== */
        function applyFilter(resetPage) {
            var keyword = document.getElementById('searchKeyword').value.trim();
            var plate = document.getElementById('searchPlate').value.trim();
            var status = document.getElementById('searchStatus').value;

            viewData = allData.filter(function (c) {
                var okKeyword = !keyword || c.ownerName.indexOf(keyword) !== -1 || c.phone.indexOf(keyword) !== -1;
                var okPlate = !plate || c.plateNo.indexOf(plate.toUpperCase()) !== -1;
                var okStatus = status === '' || c.status === Number(status);
                return okKeyword && okPlate && okStatus;
            });
            if (resetPage) currentPage = 1;   // 查询后重置到第 1 页
            renderTable();
        }

        /* 查询按钮 */
        function doSearch() {
            applyFilter(true);
        }

        /* 重置按钮：清空输入，恢复全部数据 */
        function doReset() {
            document.getElementById('searchKeyword').value = '';
            document.getElementById('searchPlate').value = '';
            document.getElementById('searchStatus').value = '';
            applyFilter(true);
        }

        /* 添加月卡：跳转到增加月卡页面 */
        function addCard() {
            location.href = 'AddmonthCard.html';
        }

        /* ========== 分页 ========== */
        function prevPage() {
            if (currentPage > 1) {
                currentPage--;
                renderTable();
            }
        }
        function nextPage() {
            var totalPages = Math.ceil(viewData.length / pageSize) || 1;
            if (currentPage < totalPages) {
                currentPage++;
                renderTable();
            }
        }
        function changePageSize() {
            pageSize = Number(document.getElementById('pageSize').value);
            currentPage = 1;
            renderTable();
        }

        /* ========== 复选框全选 / 取消全选 ========== */
        function toggleAll(headBox) {
            var boxes = document.querySelectorAll('.rowCheck');
            for (var i = 0; i < boxes.length; i++) {
                boxes[i].checked = headBox.checked;
            }
        }

        /* 批量删除 */
        function batchDelete() {
            var boxes = document.querySelectorAll('.rowCheck');
            var ids = [];
            for (var i = 0; i < boxes.length; i++) {
                if (boxes[i].checked) ids.push(Number(boxes[i].value));
            }
            if (ids.length === 0) {
                alert('请先勾选要删除的月卡记录！');
                return;
            }
            if (!confirm('确定删除选中的 ' + ids.length + ' 条月卡记录吗？')) return;
            // 根据勾选 id 过滤数组
            allData = allData.filter(function (c) {
                return ids.indexOf(c.id) === -1;
            });
            saveMonthCards(allData);   // 持久化到 localStorage
            applyFilter(false);        // 重新筛选渲染
        }

        /* 单条删除 */
        function deleteCard(id) {
            if (!confirm('确定删除该条月卡记录吗？')) return;
            allData = allData.filter(function (c) {
                return c.id !== id;
            });
            saveMonthCards(allData);
            applyFilter(false);
        }

        /* ========== 弹窗公共逻辑 ========== */
        /* 根据 id 找到月卡对象 */
        function findCard(id) {
            for (var i = 0; i < allData.length; i++) {
                if (allData[i].id === id) return allData[i];
            }
            return null;
        }

        /* 把月卡数据回填到弹窗表单 */
        function fillModal(c) {
            document.getElementById('m_ownerName').value = c.ownerName;
            document.getElementById('m_phone').value = c.phone;
            document.getElementById('m_plateNo').value = c.plateNo;
            document.getElementById('m_cardType').value = c.cardType;
            document.getElementById('m_startDate').value = c.startDate;
            document.getElementById('m_endDate').value = c.endDate;
            document.getElementById('m_payAmount').value = c.payAmount;
            document.getElementById('m_payType').value = c.payType;
            document.getElementById('m_remainDay').value = c.remainDay + ' 天';
            document.getElementById('m_status').value = c.status === 0 ? '可用' : '已过期';
            document.getElementById('m_errMsg').innerText = '';
        }

        /* 设置弹窗里所有表单元素是否只读 */
        function setModalDisabled(fieldIds, disabled) {
            for (var i = 0; i < fieldIds.length; i++) {
                document.getElementById(fieldIds[i]).disabled = disabled;
            }
        }

        /* 弹窗中修改结束日期时，自动计算剩余天数和状态 */
        function calcModalDay() {
            var endDate = document.getElementById('m_endDate').value;
            if (!endDate) return;
            var day = calcRemainDay(endDate);
            document.getElementById('m_remainDay').value = day + ' 天';
            document.getElementById('m_status').value = calcStatus(endDate) === 0 ? '可用' : '已过期';
        }

        /* 查看：全部字段只读，只展示不能修改 */
        function viewCard(id) {
            editingId = id;
            document.getElementById('modalTitle').innerText = '查看月卡信息';
            document.getElementById('modalSaveBtn').style.display = 'none';
            fillModal(findCard(id));
            var allFields = ['m_ownerName', 'm_phone', 'm_plateNo', 'm_cardType', 'm_startDate', 'm_endDate', 'm_payAmount', 'm_payType'];
            setModalDisabled(allFields, true);
            document.getElementById('modalMask').classList.add('show');
        }

        /* 编辑：全部字段都可以修改 */
        function editCard(id) {
            editingId = id;
            document.getElementById('modalTitle').innerText = '编辑月卡';
            document.getElementById('modalSaveBtn').style.display = 'inline-block';
            fillModal(findCard(id));
            var allFields = ['m_ownerName', 'm_phone', 'm_plateNo', 'm_cardType', 'm_startDate', 'm_endDate', 'm_payAmount', 'm_payType'];
            setModalDisabled(allFields, false);
            document.getElementById('modalMask').classList.add('show');
        }

        /* 关闭弹窗 */
        function closeModal() {
            document.getElementById('modalMask').classList.remove('show');
        }

        /* 弹窗保存（编辑） */
        function saveModal() {
            var errMsg = document.getElementById('m_errMsg');
            var ownerName = document.getElementById('m_ownerName').value.trim();
            var phone = document.getElementById('m_phone').value.trim();
            var plateNo = document.getElementById('m_plateNo').value.trim().toUpperCase();
            var cardType = document.getElementById('m_cardType').value;
            var startDate = document.getElementById('m_startDate').value;
            var endDate = document.getElementById('m_endDate').value;
            var payAmount = Number(document.getElementById('m_payAmount').value);
            var payType = document.getElementById('m_payType').value;

            // ---------- 表单校验 ----------
            if (!ownerName) { errMsg.innerText = '车主姓名不能为空！'; return; }
            if (!checkPhone(phone)) { errMsg.innerText = '手机号格式不正确！'; return; }
            if (!checkPlate(plateNo)) { errMsg.innerText = '车牌号格式不正确（如：赣A12345）！'; return; }
            if (!startDate || !endDate) { errMsg.innerText = '开始日期和结束日期不能为空！'; return; }
            if (new Date(endDate) < new Date(startDate)) { errMsg.innerText = '结束日期不能早于开始日期！'; return; }
            if (!(payAmount > 0)) { errMsg.innerText = '缴费金额必须为正数！'; return; }

            // ---------- 更新数据 ----------
            var card = findCard(editingId);
            card.ownerName = ownerName;
            card.phone = phone;
            card.plateNo = plateNo;
            card.cardType = cardType;
            card.startDate = startDate;
            card.endDate = endDate;
            card.payAmount = payAmount;
            card.payType = payType;
            // 自动计算剩余天数、状态
            card.remainDay = calcRemainDay(endDate);
            card.status = calcStatus(endDate);

            saveMonthCards(allData);   // 持久化
            closeModal();
            applyFilter(false);        // 刷新表格
            alert('修改成功！');
        }

        /* 页面加载完成：初始化菜单 + 渲染表格 */
        window.onload = function () {
            initLayout();
            renderTable();
        };
    </script>
</body>
</html>
