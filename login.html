<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>园区后台管理系统-登录</title>
    <link rel="stylesheet" href="./css/style.css">
</head>
<body class="login-page">
    <div class="login-box">
        <h2>🅿️ 园区后台管理系统</h2>

        <!-- 标签切换：管理员登录 / 车主登录 / 车主注册 -->
        <div class="login-tabs">
            <div class="login-tab active" data-tab="adminLogin">管理员登录</div>
            <div class="login-tab" data-tab="userLogin">车主登录</div>
            <div class="login-tab" data-tab="userRegister">车主注册</div>
        </div>

        <!-- 管理员登录表单 -->
        <div class="login-panel" id="adminLogin">
            <div class="login-field">
                <label>用户名</label>
                <input type="text" id="adminUser" placeholder="请输入管理员用户名" value="admin">
            </div>
            <div class="login-field">
                <label>密码</label>
                <input type="password" id="adminPwd" placeholder="请输入密码">
            </div>
            <button type="button" class="button login-btn" id="btnAdminLogin">登 录</button>
            <div class="login-tip" id="adminTip"></div>
            <div class="login-hint">默认管理员账号：admin / admin123</div>
        </div>

        <!-- 车主登录表单 -->
        <div class="login-panel hide" id="userLogin">
            <div class="login-field">
                <label>手机号</label>
                <input type="text" id="loginPhone" placeholder="请输入注册手机号" maxlength="11">
            </div>
            <div class="login-field">
                <label>密码</label>
                <input type="password" id="loginPwd" placeholder="请输入密码">
            </div>
            <button type="button" class="button login-btn" id="btnUserLogin">登 录</button>
            <div class="login-tip" id="userLoginTip"></div>
            <div class="login-switch">没有账号？<a data-tab="userRegister">点此注册</a></div>
        </div>

        <!-- 车主注册表单 -->
        <div class="login-panel hide" id="userRegister">
            <div class="login-field">
                <label>用户名</label>
                <input type="text" id="regName" placeholder="请输入用户名">
            </div>
            <div class="login-field">
                <label>手机号</label>
                <input type="text" id="regPhone" placeholder="请输入11位手机号" maxlength="11">
            </div>
            <div class="login-field">
                <label>车牌号</label>
                <input type="text" id="regPlate" placeholder="如：赣A12345" maxlength="8">
            </div>
            <div class="login-field">
                <label>密码</label>
                <input type="password" id="regPwd" placeholder="请设置密码（至少6位）">
            </div>
            <div class="login-field">
                <label>确认密码</label>
                <input type="password" id="regPwd2" placeholder="请再次输入密码">
            </div>
            <button type="button" class="button login-btn" id="btnRegister">注 册</button>
            <div class="login-tip" id="regTip"></div>
            <div class="login-switch">已有账号？<a data-tab="userLogin">点此登录</a></div>
        </div>
    </div>

    <script src="./js/common.js"></script>
    <script src="./js/login.js"></script>
</body>
</html>
