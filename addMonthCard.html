<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>园区后台管理系统-增加月卡</title>
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>
    <!-- 顶部头部：由 common.js 注入 -->
    <header class="header" id="header"></header>

    <div class="wrapper">
        <!-- 侧边导航栏：由 common.js 注入 -->
        <aside class="sidebar" id="sidebar"></aside>

        <!-- 右侧主内容区 -->
        <main class="main-content">
            <!-- 返回按钮 -->
            <a class="button btn-gray back-btn" href="monthCard.html">← 返回月卡列表</a>

            <!-- 标题：JS 根据模式和权限切换 -->
            <h2 id="pageTitle">增加月卡<span id="size"> ——填写车辆与缴费信息</span></h2>
            <hr>

            <!-- 计费规则提示框（JS 从 BILLING_RULES 动态渲染） -->
            <div class="billing-rules" id="billingRules">
                <h3>💡 月卡计费规则</h3>
                <table>
                    <thead><tr><th>卡类型</th><th>价格</th><th>有效期</th><th>每天均价</th></tr></thead>
                    <tbody id="billingBody"></tbody>
                </table>
            </div>

            <form id="cardForm">
                <!-- 车辆信息表单卡片 -->
                <div class="card-box form-card">
                    <h3>车辆信息</h3>
                    <div class="form-grid">
                        <div class="form-item">
                            <label>车主姓名 *</label>
                            <input type="text" name="ownerName" placeholder="请输入车主姓名">
                        </div>
                        <div class="form-item">
                            <label>手机号 *</label>
                            <input type="text" name="phone" placeholder="请输入11位手机号" maxlength="11">
                        </div>
                        <div class="form-item">
                            <label>车牌号 *</label>
                            <input type="text" name="plateNo" placeholder="如：赣A12345" maxlength="8">
                        </div>
                        <div class="form-item">
                            <label>月卡类型 *</label>
                            <select name="cardType" id="cardTypeSelect">
                                <option value="月卡">月卡</option>
                                <option value="季卡">季卡</option>
                                <option value="年卡">年卡</option>
                            </select>
                        </div>
                    </div>
                    <!-- 选中卡类型后显示的规则提示（如"月卡：300元/30天"） -->
                    <div class="billing-hint" id="billingHint"></div>
                </div>

                <!-- 缴费信息表单卡片 -->
                <div class="card-box form-card">
                    <h3>缴费信息</h3>
                    <div class="form-grid">
                        <div class="form-item">
                            <label>开始日期 *</label>
                            <input type="date" name="startDate" id="startDateInput">
                        </div>
                        <div class="form-item">
                            <label>结束日期 *</label>
                            <input type="date" name="endDate" id="endDateInput">
                        </div>
                        <div class="form-item">
                            <label>缴费金额(元) *</label>
                            <input type="number" name="payAmount" placeholder="选择卡类型自动填充" step="0.01" min="0">
                        </div>
                        <div class="form-item">
                            <label>支付方式 *</label>
                            <select name="payType">
                                <option value="微信支付">微信支付</option>
                                <option value="支付宝">支付宝</option>
                                <option value="现金">现金</option>
                            </select>
                        </div>
                        <div class="form-item">
                            <label>剩余有效天数（自动计算）</label>
                            <input type="text" name="remainDay" disabled>
                        </div>
                        <div class="form-item">
                            <label>月卡状态（自动判断）</label>
                            <input type="text" name="statusText" disabled>
                        </div>
                    </div>
                </div>

                <!-- 校验错误提示 -->
                <div class="form-tip" id="formTip"></div>

                <!-- 底部按钮 -->
                <div class="form-footer">
                    <button type="button" class="button" id="btnSave">✔ 确定</button>
                    <button type="button" class="button btn-gray" id="btnReset">✖ 重置</button>
                </div>
            </form>
        </main>
    </div>

    <script src="./js/common.js"></script>
    <script src="./js/addMonthCard.js"></script>
</body>
</html>
