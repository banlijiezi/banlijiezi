<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>园区后台管理系统-增加月卡</title>
    <link rel="stylesheet" href="./Index.css">
</head>
<script src="test.js"></script>
<body>
    <!-- 顶部导航栏 -->
    <header class="header">
        <button class="toggle-btn" id="toggleBtn">☰</button>
        <span class="title">园区后台管理系统</span>
        <span class="admin">👤 管理员：彭于晏</span>
    </header>

    <div class="wrapper">
        <!-- 左侧侧边导航栏 -->
        <aside class="sidebar">
            <ul>
                <li data-page="Index.html"><span>📊</span><span class="menu-text">仪表盘</span></li>
                <li class="active" data-page="monthCard.html"><span>📇</span><span class="menu-text">月卡管理</span></li>
            </ul>
        </aside>

        <!-- 右侧主内容区 -->
        <main class="main-content">
            <!-- 返回按钮 -->
            <button class="button btn-gray back-btn" onclick="goBack()">← 返回月卡列表</button>

            <h2 id="formTitle">增加月卡<span id="size"> --填写车辆与缴费信息</span></h2>
            <hr>

            <!-- 车辆信息表单卡片 -->
            <div class="card-box form-card">
                <h3>车辆信息</h3>
                <div class="form-grid">
                    <div class="form-item">
                        <label>车主姓名 *</label>
                        <input type="text" id="f_ownerName" placeholder="请输入车主姓名">
                    </div>
                    <div class="form-item">
                        <label>手机号 *</label>
                        <input type="text" id="f_phone" placeholder="请输入11位手机号" maxlength="11">
                    </div>
                    <div class="form-item">
                        <label>车牌号 *</label>
                        <input type="text" id="f_plateNo" placeholder="如：赣A12345" maxlength="8">
                    </div>
                    <div class="form-item">
                        <label>月卡类型 *</label>
                        <select id="f_cardType">
                            <option value="月卡">月卡</option>
                            <option value="季卡">季卡</option>
                            <option value="年卡">年卡</option>
                        </select>
                    </div>
                </div>
            </div>

            <!-- 缴费信息表单卡片 -->
            <div class="card-box form-card">
                <h3>缴费信息</h3>
                <div class="form-grid">
                    <div class="form-item">
                        <label>开始日期 *</label>
                        <input type="date" id="f_startDate" onchange="calcDay()">
                    </div>
                    <div class="form-item">
                        <label>结束日期 *</label>
                        <input type="date" id="f_endDate" onchange="calcDay()">
                    </div>
                    <div class="form-item">
                        <label>缴费金额(元) *</label>
                        <input type="number" id="f_payAmount" placeholder="请输入缴费金额">
                    </div>
                    <div class="form-item">
                        <label>支付方式 *</label>
                        <select id="f_payType">
                            <option value="微信支付">微信支付</option>
                            <option value="支付宝">支付宝</option>
                            <option value="现金">现金</option>
                        </select>
                    </div>
                    <div class="form-item">
                        <label>剩余有效天数（自动计算）</label>
                        <input type="text" id="f_remainDay" disabled placeholder="选择日期后自动计算">
                    </div>
                    <div class="form-item">
                        <label>月卡状态（自动判断）</label>
                        <input type="text" id="f_status" disabled placeholder="选择日期后自动判断">
                    </div>
                </div>
            </div>

            <!-- 校验错误提示 -->
            <div class="err-msg" id="f_errMsg"></div>

            <!-- 底部按钮 -->
            <div class="form-footer">
                <button class="button" onclick="saveCard()">✔ 确定</button>
                <button class="button btn-gray" onclick="resetForm()">✖ 重置</button>
            </div>
        </main>
    </div>

    <script>
        /* ========== 数据源 ========== */
        var cardList = getMonthCards();   // 从 localStorage 读取月卡数据
        var editId = null;                // 编辑模式下的月卡 id，新增模式为 null

        /* 返回月卡管理列表页 */
        function goBack() {
            location.href = 'monthCard.html';
        }

        /* 根据结束日期自动计算剩余天数、自动判断状态 */
        function calcDay() {
            var endDate = document.getElementById('f_endDate').value;
            if (!endDate) return;
            var day = calcRemainDay(endDate);
            document.getElementById('f_remainDay').value = day + ' 天';
            document.getElementById('f_status').value = calcStatus(endDate) === 0 ? '可用' : '已过期';
        }

        /* ========== 页面初始化：读取 URL 参数 id，区分新增 / 编辑模式 ========== */
        function initPage() {
            initLayout();
            // 使用 URLSearchParams 读取 url 查询参数 id
            var params = new URLSearchParams(location.search);
            var id = params.get('id');
            if (id) {
                // 携带 id：编辑模式，根据 id 查询数据并回填表单
                editId = Number(id);
                document.getElementById('formTitle').innerHTML = '编辑月卡<span id="size"> --修改月卡信息</span>';
                for (var i = 0; i < cardList.length; i++) {
                    if (cardList[i].id === editId) {
                        var c = cardList[i];
                        document.getElementById('f_ownerName').value = c.ownerName;
                        document.getElementById('f_phone').value = c.phone;
                        document.getElementById('f_plateNo').value = c.plateNo;
                        document.getElementById('f_cardType').value = c.cardType;
                        document.getElementById('f_startDate').value = c.startDate;
                        document.getElementById('f_endDate').value = c.endDate;
                        document.getElementById('f_payAmount').value = c.payAmount;
                        document.getElementById('f_payType').value = c.payType;
                        document.getElementById('f_remainDay').value = c.remainDay + ' 天';
                        document.getElementById('f_status').value = c.status === 0 ? '可用' : '已过期';
                        break;
                    }
                }
            }
            // 没有 id：新增模式，表单保持空白
        }

        /* ========== 表单校验 ========== */
        function validateForm(card) {
            var errMsg = document.getElementById('f_errMsg');
            if (!card.ownerName) { errMsg.innerText = '车主姓名不能为空！'; return false; }
            if (!checkPhone(card.phone)) { errMsg.innerText = '手机号格式不正确（11位手机号）！'; return false; }
            if (!checkPlate(card.plateNo)) { errMsg.innerText = '车牌号格式不正确（如：赣A12345）！'; return false; }
            if (!card.startDate || !card.endDate) { errMsg.innerText = '开始日期和结束日期不能为空！'; return false; }
            if (new Date(card.endDate) < new Date(card.startDate)) { errMsg.innerText = '结束日期不能早于开始日期！'; return false; }
            if (!(card.payAmount > 0)) { errMsg.innerText = '缴费金额必须为正数！'; return false; }
            errMsg.innerText = '';
            return true;
        }

        /* ========== 确定按钮：保存（新增 / 编辑） ========== */
        function saveCard() {
            // 获取表单输入值，组装月卡对象
            var card = {
                ownerName: document.getElementById('f_ownerName').value.trim(),
                phone: document.getElementById('f_phone').value.trim(),
                plateNo: document.getElementById('f_plateNo').value.trim().toUpperCase(),
                cardType: document.getElementById('f_cardType').value,
                startDate: document.getElementById('f_startDate').value,
                endDate: document.getElementById('f_endDate').value,
                payAmount: Number(document.getElementById('f_payAmount').value),
                payType: document.getElementById('f_payType').value
            };

            // 表单校验不通过则阻止提交
            if (!validateForm(card)) return;

            // 自动计算剩余有效天数、自动判断状态
            card.remainDay = calcRemainDay(card.endDate);
            card.status = calcStatus(card.endDate);

            if (editId === null) {
                // 新增模式：Date.now() 生成唯一 id，push 到数组
                card.id = Date.now();
                cardList.push(card);
            } else {
                // 编辑模式：找到对应下标替换数组对象
                card.id = editId;
                for (var i = 0; i < cardList.length; i++) {
                    if (cardList[i].id === editId) {
                        cardList[i] = card;
                        break;
                    }
                }
            }

            // 写入 localStorage 持久化保存
            saveMonthCards(cardList);
            alert('保存成功！');
            // 保存成功跳转回月卡管理页面
            location.href = 'monthCard.html';
        }

        /* 重置按钮：清空全部表单输入和错误提示 */
        function resetForm() {
            document.getElementById('f_ownerName').value = '';
            document.getElementById('f_phone').value = '';
            document.getElementById('f_plateNo').value = '';
            document.getElementById('f_cardType').value = '月卡';
            document.getElementById('f_startDate').value = '';
            document.getElementById('f_endDate').value = '';
            document.getElementById('f_payAmount').value = '';
            document.getElementById('f_payType').value = '微信支付';
            document.getElementById('f_remainDay').value = '';
            document.getElementById('f_status').value = '';
            document.getElementById('f_errMsg').innerText = '';
        }

        /* 页面加载完成后初始化 */
        window.onload = initPage;
    </script>
</body>
</html>
